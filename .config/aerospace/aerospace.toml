config-version = 2
start-at-login = true
auto-reload-config = true

# One tiling window fills the usable screen without entering macOS fullscreen.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
gaps.inner.horizontal = 0
gaps.inner.vertical = 0
gaps.outer.left = 0
gaps.outer.right = 0
gaps.outer.top = 0
gaps.outer.bottom = 0

# Only the primary Dock applications participate in tiling, each in a
# predictable workspace.
[[on-window-detected]]
if = 'test %{app-bundle-id} = ru.yandex.desktop.yandex-browser'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.mitchellh.ghostty'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if = 'test %{app-bundle-id} = ru.yandex.yamb'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if = 'test %{app-bundle-id} = ru.keepcoder.Telegram'
run = 'move-node-to-workspace 4'

# Everything outside the whitelist stays on the current workspace and floats.
[[on-window-detected]]
if = 'true'
run = 'layout floating'

[mode.main.binding]
cmd-1 = 'exec-and-forget open -a Yandex'
cmd-2 = 'exec-and-forget open -a Ghostty'
cmd-3 = 'exec-and-forget open -a "Yandex Messenger"'
cmd-4 = 'exec-and-forget open -a Telegram'
